name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each step runs even if an earlier one failed, so a single push reports
      # every problem at once rather than one per re-run.
      - name: Type-check
        if: "!cancelled()"
        run: npx tsc --noEmit

      - name: Test
        if: "!cancelled()"
        run: npm run test

      - name: Lint
        if: "!cancelled()"
        run: npm run lint

      - name: Format check
        if: "!cancelled()"
        run: npm run format:check
